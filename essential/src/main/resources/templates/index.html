<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESSENTIAL | Clothing Store</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <header th:replace="~{fragments/layout :: header}"></header>

    <div th:replace="~{fragments/layout :: alerts}"></div>

    <main>
        <section class="hero">
            <div class="hero-content">
                <p class="subtitle">THE NEW COLLECTION</p>
                <h1>STYLE IS<br>EVERYTHING.</h1>
                <p class="hero-description">
                    Discover your style. Find your essentials.
                </p>
                <a th:href="@{/shop}" class="shop-button">SHOP NOW</a>
            </div>
        </section>

        <section class="categories">
            <div class="category">
                <img src="https://images.unsplash.com/photo-1483985988355-763728e1935b?w=900"
                     alt="Women's fashion">
                <div class="category-content">
                    <h2>WOMEN</h2>
                    <a th:href="@{/shop(gender='Women')}">DISCOVER COLLECTION</a>
                </div>
            </div>

            <div class="category">
                <img src="https://images.unsplash.com/photo-1516257984-b1b4d707412e?w=900"
                     alt="Men's fashion">
                <div class="category-content">
                    <h2>MEN</h2>
                    <a th:href="@{/shop(gender='Men')}">DISCOVER COLLECTION</a>
                </div>
            </div>
        </section>

        <section class="new-arrivals" id="new">
            <div class="section-heading">
                <p>OUR SELECTION</p>
                <h2>NEW ARRIVALS</h2>
            </div>

            <div class="products">
                <div class="product" th:each="product : ${newArrivals}">
                    <a th:href="@{/shop}">
                        <img th:src="@{${product.imageUrl}}" th:alt="${product.name}">
                    </a>
                    <h3 th:text="${#strings.toUpperCase(product.name)}">PRODUCT NAME</h3>
                    <p th:text="${#numbers.formatDecimal(product.price, 1, 'NONE', 2, 'POINT')} + ' RON'">79.99 RON</p>
                </div>
            </div>

            <p class="empty-note" th:if="${#lists.isEmpty(newArrivals)}">No products yet.</p>
        </section>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
