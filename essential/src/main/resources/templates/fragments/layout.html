<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>

<!-- Meniul de sus, folosit pe toate paginile -->
<header class="navbar" th:fragment="header">
    <div class="logo"><a th:href="@{/}">ESSENTIAL<span>.</span></a></div>

    <nav>
        <a th:href="@{/}">HOME</a>
        <a th:href="@{/shop}">SHOP</a>
        <a th:href="@{/shop(gender='Women')}">WOMEN</a>
        <a th:href="@{/shop(gender='Men')}">MEN</a>
    </nav>

    <div class="nav-icons">
        <a th:href="@{/cart}" class="bag-link">BAG (<span th:text="${cartCount}">0</span>)</a>
    </div>
</header>

<!-- Mesajele de succes / eroare (flash) -->
<div th:fragment="alerts">
    <div class="alert alert-success" th:if="${message}" th:text="${message}">Message</div>
    <div class="alert alert-error" th:if="${error}" th:text="${error}">Error</div>
</div>

<footer th:fragment="footer">
    <h2>ESSENTIAL.</h2>
    <p>EVERYDAY STYLE. EVERYDAY ESSENTIALS.</p>
    <p>&copy; 2026 ESSENTIAL. ALL RIGHTS RESERVED.</p>
</footer>

</body>
</html>
