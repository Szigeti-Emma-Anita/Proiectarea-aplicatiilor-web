spring.application.name=essential

# H2 Database (fisier local, datele raman intre porniri)
spring.datasource.url=jdbc:h2:file:./data/essentialdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# H2 Console (doar pentru dezvoltare - dezactiveaz-o in productie)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Cosul traieste in sesiune
server.servlet.session.timeout=60m
